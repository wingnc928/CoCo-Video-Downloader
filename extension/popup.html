<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body { 
      width: 340px; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      margin: 0; 
      padding: 14px; 
      background: #121212; 
      color: #e0e0e0; 
    }
    .header { 
      font-size: 15px; 
      font-weight: 700; 
      margin-bottom: 10px; 
      color: #ff4757; 
      display: flex;
      align-items: center;
      justify-content: space-between; /* 按钮对齐 */
    }
    .task-btn {
      background: #1e1e1e;
      color: #ff4757;
      border: 1px solid #333;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }
    .task-btn:hover { background: #2a2a2a; }
    
    .url-box { 
      background: #1e1e1e; 
      padding: 8px; 
      border-radius: 6px; 
      font-size: 11px; 
      color: #888; 
      margin-bottom: 12px; 
      word-break: break-all; 
      max-height: 48px; 
      overflow-y: auto;
      border: 1px solid #333;
    }
    .batch-container {
      background: #1e1e1e;
      border: 1px solid #333;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: none;
    }
    .batch-header {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .batch-list {
      max-height: 140px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .batch-item {
      display: flex;
      align-items: flex-start;
      margin: 6px 0;
      font-size: 11px;
    }
    .batch-item input[type="checkbox"] {
      margin-right: 8px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: #ff4757;
    }
    .batch-item label {
      color: #e0e0e0;
      cursor: pointer;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }
    select, button.main-btn { 
      width: 100%; 
      padding: 9px; 
      margin-bottom: 10px; 
      border: none; 
      border-radius: 5px; 
      font-size: 12px; 
      outline: none;
    }
    select {
      background: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #444;
      cursor: pointer;
    }
    button.main-btn { 
      background: #ff4757; 
      color: white; 
      font-weight: 700; 
      cursor: pointer; 
      transition: background 0.2s;
    }
    button.main-btn:hover { background: #e03e4d; }
    button.main-btn:disabled { 
      background: #444; 
      cursor: not-allowed; 
      color: #999;
    }
    .progress-container { 
      margin-top: 6px; 
      background: #1e1e1e;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
    }
    .progress-bar { 
      width: 100%; 
      height: 8px; 
      background: #333; 
      border-radius: 4px; 
      overflow: hidden; 
      margin-bottom: 6px;
    }
    .progress-fill { 
      height: 100%; 
      background: #ff4757; 
      width: 0%; 
      transition: width 0.3s ease; 
      border-radius: 4px;
    }
    .status { 
      font-size: 11px; 
      color: #aaa; 
      text-align: center; 
      font-family: Consolas, monospace;
    }
    
    /* 【UI迭代】新增：正在运行任务中心面板样式 */
    .manager-panel {
      background: #161616;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
      display: none;
    }
    .manager-title {
      font-size: 12px;
      font-weight: bold;
      color: #ff4757;
      margin-bottom: 8px;
      border-bottom: 1px solid #222;
      padding-bottom: 4px;
    }
    .manager-list {
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }
    /* 自定义滚动条样式，使其融入暗黑主题 */
    .manager-list::-webkit-scrollbar, .batch-list::-webkit-scrollbar {
      width: 6px;
    }
    .manager-list::-webkit-scrollbar-track, .batch-list::-webkit-scrollbar-track {
      background: #161616;
      border-radius: 3px;
    }
    .manager-list::-webkit-scrollbar-thumb, .batch-list::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }
    .manager-list::-webkit-scrollbar-thumb:hover, .batch-list::-webkit-scrollbar-thumb:hover {
      background: #ff4757;
    }
    .manager-item {
      font-size: 11px;
      border-bottom: 1px solid #222;
      padding: 6px 0;
    }
    .manager-item-title {
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .manager-item-meta {
      display: flex;
      justify-content: space-between;
      color: #888;
    }

    .settings-link { 
      font-size: 11px; 
      color: #ff4757; 
      text-decoration: none; 
      display: block; 
      text-align: center; 
      margin-top: 10px; 
      padding-top: 8px;
      border-top: 1px solid #333;
    }
    .settings-link:hover { text-decoration: underline; }
    .server-offline {
      background: #2a1a1a;
      border: 1px solid #ff4757;
      color: #ff4757;
      padding: 8px;
      border-radius: 5px;
      font-size: 11px;
      text-align: center;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>&#11015; CoCo-Video-Downloader</span>
    <!-- 交互切换按钮 -->
    <button class="task-btn" id="toggle-manager-btn">查看任务中心</button>
  </div>

  <div class="server-offline" id="server-offline">
    &#9888; Server offline. Run <b>Start_Server.bat</b> first.
  </div>

  <!-- 【UI迭代】新增：实时任务监视器面板 -->
  <div class="manager-panel" id="manager-panel">
    <div class="manager-title">当前后台活动任务</div>
    <div class="manager-list" id="manager-list-items">
      <div style="text-align:center; color:#555; padding:20px 0;">暂无正在进行的后台任务</div>
    </div>
  </div>

  <!-- 主下载工作流区块 -->
  <div id="main-workflow-block">
    <div class="url-box" id="url">Detecting page...</div>

    <div class="batch-container" id="video-list-container">
      <div class="batch-header">
        <span>检测到批量视频列表:</span>
        <a href="#" id="select-all" style="color: #ff4757; text-decoration: none; font-weight: bold;">全选 / 反选</a>
      </div>
      <div class="batch-list" id="list-items"></div>
    </div>

    <select id="format">
      <option value="best">Best Quality</option>
      <option value="1080p">1080p</option>
      <option value="720p">720p</option>
      <option value="mp3">Audio Only (MP3)</option>
    </select>

    <button class="main-btn" id="download-btn">Download Video</button>

    <div class="progress-container">
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <div class="status" id="status">Ready - click Download to start</div>
    </div>
  </div>

  <a href="#" class="settings-link" id="settings-link">&#9881; Advanced Settings</a>

  <script src="popup.js"></script>
</body>
</html>
